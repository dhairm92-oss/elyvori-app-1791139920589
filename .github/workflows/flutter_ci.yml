name: Flutter CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install packages
        run: flutter pub get
      - name: Static analysis
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          grep -E "^ *(error|warning) " analyze.txt | head -40 | while IFS= read -r line; do
            lvl=error; case "$line" in *warning*) lvl=warning;; esac
            echo "::$lvl title=flutter analyze::$(echo "$line" | sed 's/^ *//')"
          done
          exit $code
      - name: Unit and widget tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          code=$?
          cat test.txt
          if [ $code -ne 0 ]; then
            msg=$(grep -E "Error|Expected|Actual|FAILED|failed|\.dart[: ]+[0-9]+" test.txt | head -40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter test::$msg"
          fi
          exit $code
